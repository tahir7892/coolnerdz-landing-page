server {
    listen 80;
    listen [::]:80;
    server_name coolnerdz.com www.coolnerdz.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://coolnerdz.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name coolnerdz.com www.coolnerdz.com;

    ssl_certificate /etc/letsencrypt/live/coolnerdz.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/coolnerdz.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    if ($host = www.coolnerdz.com) {
        return 301 https://coolnerdz.com$request_uri;
    }

    location /static/ {
        alias /opt/coolnerdz-landing-page/staticfiles/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    location /media/ {
        alias /opt/coolnerdz-landing-page/media/;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
