server {
    listen 80;
    listen [::]:80;
    server_name coolnerdz.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://coolnerdz.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name coolnerdz.com;

    ssl_certificate /etc/letsencrypt/live/coolnerdz.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/coolnerdz.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /opt/coolnerdz-landing-page;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:png|jpg|jpeg|gif|webp|svg|ico|css|js|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }
}
