name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    name: Validate Django project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Run tests
        run: python manage.py test

  deploy:
    name: Deploy to server
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate SSH secrets
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          test -n "$SSH_HOST" || { echo "Missing required secret: SSH_HOST"; exit 1; }
          test -n "$SSH_PRIVATE_KEY" || { echo "Missing required secret: SSH_PRIVATE_KEY"; exit 1; }
          test -n "$SSH_USER" || { echo "Missing required secret: SSH_USER"; exit 1; }

      - name: Add server to known_hosts
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          ssh-keyscan -p "${SSH_PORT:-22}" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Deploy via rsync over SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          eval "$(ssh-agent -s)"
          ssh-add - <<< "${{ secrets.SSH_PRIVATE_KEY }}"
          rsync -rlptvz --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='env' \
            --exclude='*.sqlite' \
            --exclude='*.sqlite3' \
            --exclude='*.sqlite3-*' \
            --exclude='*.sqlite3.backup-*' \
            --exclude='.env' \
            --exclude='staticfiles' \
            --exclude='media' \
            -e "ssh -p ${SSH_PORT:-22}" \
            ./ "$SSH_USER@$SSH_HOST:/opt/coolnerdz-landing-page/"

      - name: Install dependencies, migrate, and restart app
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          eval "$(ssh-agent -s)"
          ssh-add - <<< "${{ secrets.SSH_PRIVATE_KEY }}"
          ssh -p "${SSH_PORT:-22}" "$SSH_USER@$SSH_HOST" '
            set -e
            cd /opt/coolnerdz-landing-page
            test -d env || python3 -m venv env
            env/bin/pip install -r requirements.txt
            env/bin/python manage.py migrate --noinput
            env/bin/python manage.py collectstatic --noinput
            sudo systemctl restart coolnerdz-django
          '
