name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    name: Validate HTML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required files exist
        run: test -f index.html

      - name: Lint HTML
        run: npx --yes html-validate index.html

  deploy:
    name: Deploy to server
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate SSH secrets
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          test -n "$SSH_HOST" || { echo "Missing required secret: SSH_HOST"; exit 1; }
          test -n "$SSH_PRIVATE_KEY" || { echo "Missing required secret: SSH_PRIVATE_KEY"; exit 1; }
          test -n "$SSH_USER" || { echo "Missing required secret: SSH_USER"; exit 1; }

      - name: Add server to known_hosts
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          ssh-keyscan -p "${SSH_PORT:-22}" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Deploy via rsync over SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          eval "$(ssh-agent -s)"
          ssh-add - <<< "${{ secrets.SSH_PRIVATE_KEY }}"
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='*.sqlite' \
            --exclude='*.sqlite3' \
            -e "ssh -p ${SSH_PORT:-22}" \
            ./ "$SSH_USER@$SSH_HOST:/opt/coolnerdz-landing-page/"

      - name: Install dependencies and restart app
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          eval "$(ssh-agent -s)"
          ssh-add - <<< "${{ secrets.SSH_PRIVATE_KEY }}"
          ssh -p "${SSH_PORT:-22}" "$SSH_USER@$SSH_HOST" '
            set -e
            cd /opt/coolnerdz-landing-page
            npm install --omit=dev
            npx pm2 describe coolnerdz-waitlist > /dev/null 2>&1 \
              && PORT=3003 npx pm2 restart coolnerdz-waitlist --update-env \
              || PORT=3003 npx pm2 start server.js --name coolnerdz-waitlist
            npx pm2 save
          '
